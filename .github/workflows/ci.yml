name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint-typecheck-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # pgvector-Image, da #6 eine Vektor-Spalte braucht
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: research_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U research"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RA_DATABASE_URL: postgresql+psycopg://research:research@localhost:5432/research_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Abhängigkeiten installieren
        run: uv sync --locked

      - name: ruff format
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check --output-format=github

      - name: pyright
        run: uv run pyright

      - name: pytest
        run: uv run pytest
